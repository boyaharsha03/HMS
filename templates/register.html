{% extends 'base.html' %}{% block title %}Register | CarePoint{% endblock %}{% block content %}<div class="auth-shell"><div class="card p-4 p-md-5 col-11 col-sm-9 col-lg-6"><div class="eyebrow">Patient registration</div><h1 class="h2 mb-4">Create your account</h1><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" value="{{ form.name if form else '' }}" required></div><div class="col-md-6"><label class="form-label">Phone number</label><input class="form-control" name="phone" value="{{ form.phone if form else '' }}" required></div><div class="col-12"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ form.email if form else '' }}" required></div><div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-md-6"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="8" required></div></div><button class="btn btn-primary w-100 mt-4">Send verification OTP</button></form></div></div>{% endblock %}
