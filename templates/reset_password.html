{% extends 'base.html' %}{% block title %}Reset password | CarePoint{% endblock %}{% block content %}<div class="auth-shell"><div class="card p-4 p-md-5 col-11 col-sm-8 col-lg-5"><div class="eyebrow">Account recovery</div><h1 class="h2 mb-3">Set a new password</h1><p class="text-secondary">Use the OTP sent to <strong>{{ email }}</strong>. Your password must contain at least eight characters, including a letter and number.</p><form method="post"><label class="form-label">Reset OTP</label><input class="form-control mb-3" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><label class="form-label">New password</label><input class="form-control mb-3" type="password" name="password" minlength="8" required><label class="form-label">Confirm new password</label><input class="form-control mb-4" type="password" name="confirm_password" minlength="8" required><button class="btn btn-primary w-100">Reset password</button></form></div></div>{% endblock %}
