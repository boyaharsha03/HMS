{% extends 'base.html' %}{% block title %}Edit patient | CarePoint{% endblock %}{% block content %}<section class="section-pad"><div class="container col-lg-8"><div class="eyebrow">Administration</div><h1 class="h2 mb-4">Edit patient details</h1><form method="post" class="card p-4"><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="name" value="{{ patient.name }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ patient.email }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ patient.phone or '' }}" required></div><div class="col-md-6"><label class="form-label">Date of birth</label><input class="form-control" type="date" name="date_of_birth" value="{{ patient.date_of_birth or '' }}"></div><div class="col-md-6"><label class="form-label">Gender</label><input class="form-control" name="gender" value="{{ patient.gender or '' }}"></div><div class="col-md-6"><label class="form-label">Account status</label><select class="form-select" name="user_status"><option {% if patient.status == 'Active' %}selected{% endif %}>Active</option><option {% if patient.status == 'Inactive' %}selected{% endif %}>Inactive</option></select></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="4">{{ patient.address or '' }}</textarea></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save changes</button><a class="btn btn-outline-secondary" href="{{ url_for('admin.patients') }}">Cancel</a></div></form></div></section>{% endblock %}
