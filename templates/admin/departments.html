{% extends 'base.html' %}{% block title %}Departments | CarePoint{% endblock %}{% block content %}<section class="section-pad"><div class="container col-lg-9"><div class="eyebrow">Administration</div><h1 class="h2">Departments</h1><form method="post" class="card p-4 my-4"><div class="row g-2"><div class="col-md-4"><input class="form-control" name="name" placeholder="Department name" required></div><div class="col-md-6"><input class="form-control" name="description" placeholder="Short description"></div><div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div></div></form><div class="row g-3">{% for department in departments %}<div class="col-md-6"><div class="card p-3 d-flex flex-row justify-content-between"><div><h5>{{ department.name }}</h5><p class="text-secondary mb-0">{{ department.description }}</p></div><form method="post" action="{{ url_for('admin.delete_department', department_id=department.id) }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></div></div>{% endfor %}</div></div></section>{% endblock %}
