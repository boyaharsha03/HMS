{% extends 'base.html' %}{% block title %}Verify email | CarePoint{% endblock %}{% block content %}<div class="auth-shell"><div class="card p-4 p-md-5 col-11 col-sm-8 col-lg-5 text-center"><div class="eyebrow">One more step</div><h1 class="h2">Verify your email</h1><p class="text-secondary">Enter the six-digit code sent to <strong>{{ email }}</strong>. It expires in five minutes.</p><form method="post"><input class="form-control form-control-lg text-center mb-3" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required><button class="btn btn-primary w-100">Verify email</button></form><form method="post" action="{{ url_for('auth.resend_otp') }}"><button class="btn btn-link mt-2">Resend OTP</button></form></div></div>{% endblock %}
