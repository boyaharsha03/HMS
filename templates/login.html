{% extends 'base.html' %}{% block title %}Log in | CarePoint{% endblock %}{% block content %}<div class="auth-shell"><div class="card p-4 p-md-5 col-11 col-sm-8 col-lg-5"><div class="eyebrow">Welcome back</div><h1 class="h2 mb-4">Log in to CarePoint</h1><form method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required autofocus><label class="form-label">Password</label><input class="form-control mb-2" type="password" name="password" required><div class="text-end mb-4"><a class="small" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></div><button class="btn btn-primary w-100">Log in</button></form><p class="text-secondary small mt-4 mb-0">New to CarePoint? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></div>{% endblock %}
