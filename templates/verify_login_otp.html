{% extends 'base.html' %}{% block title %}Confirm login | CarePoint{% endblock %}{% block content %}<div class="auth-shell"><div class="card p-4 p-md-5 col-11 col-sm-8 col-lg-5 text-center"><div class="eyebrow">Secure login</div><h1 class="h2">Confirm your login</h1><p class="text-secondary">Enter the six-digit OTP sent to <strong>{{ email }}</strong>.</p><form method="post"><input class="form-control form-control-lg text-center mb-3" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus><button class="btn btn-primary w-100">Verify and continue</button></form><form method="post" action="{{ url_for('auth.resend_login_otp') }}"><button class="btn btn-link mt-2">Resend login OTP</button></form><a class="small d-block mt-2" href="{{ url_for('auth.login') }}">Cancel</a></div></div>{% endblock %}
