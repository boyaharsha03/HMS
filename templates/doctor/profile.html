{% extends 'base.html' %}{% block title %}Doctor profile | CarePoint{% endblock %}{% block content %}<section class="section-pad"><div class="container col-lg-8"><div class="eyebrow">Professional profile</div><h1 class="h2 mb-4">Update your profile.</h1><form method="post" class="card p-4"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ doctor.name }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ doctor.phone }}"></div><div class="col-md-6"><label class="form-label">Specialization</label><input class="form-control" name="specialization" value="{{ doctor.specialization }}" required></div><div class="col-md-6"><label class="form-label">Qualification</label><input class="form-control" name="qualification" value="{{ doctor.qualification or '' }}"></div><div class="col-md-6"><label class="form-label">Experience (years)</label><input class="form-control" type="number" min="0" name="experience" value="{{ doctor.experience }}"></div><div class="col-md-6"><label class="form-label">Consultation fee</label><input class="form-control" type="number" min="0" step="0.01" name="consultation_fee" value="{{ doctor.consultation_fee }}"></div><div class="col-12"><label class="form-label">Profile description</label><textarea class="form-control" name="profile_description" rows="4">{{ doctor.profile_description or '' }}</textarea></div></div><button class="btn btn-primary mt-4">Save profile</button></form></div></section>{% endblock %}
