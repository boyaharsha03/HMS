{% extends 'base.html' %}{% block title %}Availability | CarePoint{% endblock %}{% block content %}<section class="section-pad"><div class="container col-lg-8"><div class="eyebrow">Schedule</div><h1 class="h2">Manage availability</h1><form method="post" class="card p-4 my-4"><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label">Day</label><select class="form-select" name="day_of_week" required>{% for day in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}<option>{{ day }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Start</label><input class="form-control" type="time" name="start_time" required></div><div class="col-md-3"><label class="form-label">End</label><input class="form-control" type="time" name="end_time" required></div><div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div></div></form><div class="table-responsive card"><table class="table mb-0"><thead><tr><th>Day</th><th>Hours</th><th></th></tr></thead><tbody>{% for slot in availability %}<tr><td>{{ slot.day_of_week }}</td><td>{{ slot.start_time }}–{{ slot.end_time }}</td><td><form method="post" action="{{ url_for('doctor.delete_availability', slot_id=slot.id) }}"><button class="btn btn-sm btn-outline-danger">Remove</button></form></td></tr>{% else %}<tr><td colspan="3" class="p-3 text-secondary">No availability added.</td></tr>{% endfor %}</tbody></table></div></div></section>{% endblock %}
