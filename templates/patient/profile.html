{% extends 'base.html' %}{% block title %}My profile | CarePoint{% endblock %}{% block content %}<section class="section-pad"><div class="container col-lg-8"><div class="eyebrow">Patient profile</div><h1 class="h2 mb-4">Keep your details current.</h1><form method="post" class="card p-4"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ patient.name }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ patient.phone }}" required></div><div class="col-md-6"><label class="form-label">Date of birth</label><input class="form-control" type="date" name="date_of_birth" value="{{ patient.date_of_birth or '' }}"></div><div class="col-md-6"><label class="form-label">Gender</label><input class="form-control" name="gender" value="{{ patient.gender or '' }}"></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="3">{{ patient.address or '' }}</textarea></div></div><button class="btn btn-primary mt-4">Save profile</button></form></div></section>{% endblock %}
