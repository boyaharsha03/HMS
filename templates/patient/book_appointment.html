{% extends 'base.html' %}{% block title %}Book appointment | CarePoint{% endblock %}{% block content %}<section class="section-pad"><div class="container col-lg-7"><div class="eyebrow">Appointments</div><h1 class="h2 mb-4">Choose a time that works.</h1><form method="post" class="card p-4"><label class="form-label">Doctor</label><select class="form-select mb-3" name="doctor_id" required><option value="">Select a doctor</option>{% for doctor in doctors %}<option value="{{ doctor.id }}">Dr. {{ doctor.name }} · {{ doctor.specialization }}</option>{% endfor %}</select><div class="row g-3"><div class="col-md-6"><label class="form-label">Date</label><input class="form-control" type="date" min="{{ min_date }}" name="appointment_date" required></div><div class="col-md-6"><label class="form-label">Time</label><input class="form-control" type="time" name="appointment_time" required></div></div><label class="form-label mt-3">Reason for visit</label><textarea class="form-control" name="reason" rows="4" placeholder="Share anything that will help the care team prepare."></textarea><button class="btn btn-primary mt-4">Confirm appointment</button></form></div></section>{% endblock %}
